<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Premium Domains | Mrad Domains</title>

  <link rel="icon" type="image/png" href="https://mrad.co/image/favicon.png" />

  <!-- Shared Global Components -->
  <script src="https://mrad.co/header.js?v=302" defer></script>
  <script src="https://mrad.co/footer.js?v=105" defer></script>

  <!-- Local Subdomain Navigations -->
  <script src="/header-navigation.js" defer></script>
  <script src="/footer-navigation.js?v=300" defer></script>

  <!-- Shared Data Fetcher -->
  <script src="/premium/assets/js/premium-data.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .mrad-catalog-main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 40px auto;
      padding: 0 20px;
    }

    .mrad-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: #64748b;
      margin-bottom: 24px;
    }

    .mrad-breadcrumb a {
      color: #64748b;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .mrad-breadcrumb a:hover {
      color: #000000;
    }

    .mrad-catalog-header {
      margin-bottom: 28px;
    }

    .mrad-catalog-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #000000;
      margin-bottom: 8px;
    }

    .mrad-catalog-subtitle {
      color: #64748b;
      font-size: 1rem;
    }

    /* Filter & Quick Search Controls */
    .mrad-controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      justify-content: space-between;
      align-items: center;
    }

    .mrad-search-input {
      flex: 1;
      min-width: 240px;
      max-width: 400px;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      background: #ffffff;
      transition: border-color 0.15s ease;
    }

    .mrad-search-input:focus {
      border-color: #000000;
    }

    .mrad-filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .mrad-select {
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.88rem;
      background: #ffffff;
      color: #0f172a;
      outline: none;
      cursor: pointer;
    }

    /* Inventory Table */
    .mrad-table-wrap {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    thead {
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      padding: 14px 20px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #64748b;
      font-weight: 700;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background-color 0.12s ease;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: #f8fafc;
    }

    td {
      padding: 16px 20px;
      font-size: 0.92rem;
      white-space: nowrap;
      color: #1e293b;
    }

    .mrad-td-domain {
      font-weight: 700;
      color: #000000;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .mrad-td-domain span {
      color: #3b82f6;
    }

    .mrad-td-domain:hover {
      text-decoration: underline;
    }

    .mrad-tld-pill {
      background: #f1f5f9;
      color: #475569;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .mrad-btn-view {
      display: inline-block;
      background: #000000;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    .mrad-btn-view:hover {
      opacity: 0.8;
    }

    /* States */
    .mrad-state-row td {
      text-align: center;
      padding: 48px 20px;
      color: #64748b;
    }

    .mrad-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #e2e8f0;
      border-top-color: #000000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <mrad-header></mrad-header>
  <mrad-header-nav></mrad-header-nav>

  <main class="mrad-catalog-main">
    <div class="mrad-breadcrumb">
      <a href="/premium">Premium</a>
      <span>/</span>
      <span>Catalog</span>
    </div>

    <div class="mrad-catalog-header">
      <h1 class="mrad-catalog-title">All Premium Domains</h1>
      <p class="mrad-catalog-subtitle" id="catalogSummary">Loading complete verified catalog...</p>
    </div>

    <div class="mrad-controls-bar">
      <input
        type="text"
        id="quickSearchInput"
        class="mrad-search-input"
        placeholder="Filter by keyword or extension..."
      />

      <div class="mrad-filter-group">
        <select id="tldFilter" class="mrad-select">
          <option value="all">All Extensions</option>
        </select>

        <select id="sortBy" class="mrad-select">
          <option value="name-asc">Domain (A - Z)</option>
          <option value="name-desc">Domain (Z - A)</option>
          <option value="price-asc">Price (Low to High)</option>
          <option value="price-desc">Price (High to Low)</option>
        </select>
      </div>
    </div>

    <div class="mrad-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Domain Asset</th>
            <th>TLD</th>
            <th>Buy Now</th>
            <th>Monthly Lease</th>
            <th>Installment</th>
            <th style="text-align: right;">Action</th>
          </tr>
        </thead>
        <tbody id="inventoryBody">
          <tr class="mrad-state-row">
            <td colspan="6">
              <div class="mrad-spinner"></div>
              <span>Loading premium domain inventory...</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <mrad-footer>
    <mrad-footer-nav></mrad-footer-nav>
  </mrad-footer>

  <script>
    (async function () {
      const tbody = document.getElementById("inventoryBody");
      const summaryEl = document.getElementById("catalogSummary");
      const searchInput = document.getElementById("quickSearchInput");
      const tldSelect = document.getElementById("tldFilter");
      const sortSelect = document.getElementById("sortBy");

      let allDomains = [];

      function formatPrice(val, suffix = "") {
        if (val === null || val === undefined) return "—";
        return "$" + Number(val).toLocaleString() + suffix;
      }

      function renderTable(list) {
        if (!list.length) {
          tbody.innerHTML = `
            <tr class="mrad-state-row">
              <td colspan="6">No domains match your active filters.</td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = list
          .map((item) => {
            const ext = item.extension || "";
            const baseName = item.name || item.domain.replace(ext, "");
            const viewUrl = `/premium/view?domain=${encodeURIComponent(item.domain)}`;

            return `
              <tr>
                <td>
                  <a href="${viewUrl}" class="mrad-td-domain">
                    ${baseName}<span>${ext}</span>
                  </a>
                </td>
                <td>
                  <span class="mrad-tld-pill">${ext || "—"}</span>
                </td>
                <td style="font-weight: 700; color: #000000;">
                  ${formatPrice(item.buyPrice)}
                </td>
                <td>
                  ${formatPrice(item.rentPrice, "/mo")}
                </td>
                <td>
                  ${formatPrice(item.installmentPrice, "/mo")}
                </td>
                <td style="text-align: right;">
                  <a href="${viewUrl}" class="mrad-btn-view">View</a>
                </td>
              </tr>
            `;
          })
          .join("");
      }

      function applyFilters() {
        const query = searchInput.value.trim().toLowerCase();
        const selectedTld = tldSelect.value;
        const sortVal = sortSelect.value;

        let filtered = allDomains.filter((d) => {
          const matchQuery =
            !query ||
            d.domain.toLowerCase().includes(query) ||
            d.name.toLowerCase().includes(query);

          const matchTld =
            selectedTld === "all" || d.extension.toLowerCase() === selectedTld;

          return matchQuery && matchTld;
        });

        filtered.sort((a, b) => {
          if (sortVal === "name-asc") return a.domain.localeCompare(b.domain);
          if (sortVal === "name-desc") return b.domain.localeCompare(a.domain);
          if (sortVal === "price-asc") return (a.buyPrice || 0) - (b.buyPrice || 0);
          if (sortVal === "price-desc") return (b.buyPrice || 0) - (a.buyPrice || 0);
          return 0;
        });

        renderTable(filtered);
      }

      // 1. Fetch data
      allDomains = await MRAD_PREMIUM.getDomains();
      summaryEl.textContent = `${allDomains.length} premium digital ${
        allDomains.length === 1 ? "asset" : "assets"
      } available for instant acquisition.`;

      // 2. Populate extension options dynamically
      const extensions = Array.from(
        new Set(allDomains.map((d) => d.extension).filter(Boolean))
      ).sort();

      extensions.forEach((ext) => {
        const opt = document.createElement("option");
        opt.value = ext.toLowerCase();
        opt.textContent = ext;
        tldSelect.appendChild(opt);
      });

      // 3. Bind interactive filters
      searchInput.addEventListener("input", applyFilters);
      tldSelect.addEventListener("change", applyFilters);
      sortSelect.addEventListener("change", applyFilters);

      // Initial render
      applyFilters();
    })();
  </script>
</body>
</html>
