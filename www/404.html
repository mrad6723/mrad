<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">404 — Page Not Found | Mrad</title>

  <link rel="icon" type="image/png" href="https://mrad.co/image/favicon.png" />

  <!-- Local Subdomain Navigations -->
  <script src="/header-navigation.js" defer></script>
  <script src="/footer-navigation.js" defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    mrad-header {
      display: block;
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      z-index: 10000;
      width: 100%;
      background: #ffffff;
    }

    .mrad-global-bar {
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }

    .mrad-global-container {
      max-width: 1200px;
      margin: 0 auto;
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mrad-global-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .mrad-brand-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 4px;
      display: block;
    }

    .mrad-brand-title {
      color: #000000;
      font-size: 1.18rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mrad-service-badge {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #000000;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 5px;
      text-transform: uppercase;
    }

    .mrad-global-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .mrad-support-link {
      color: #000000;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: opacity 0.15s ease;
    }

    .mrad-auth-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mrad-btn-auth {
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      padding: 6px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .mrad-btn-account {
      background: #000000;
      color: #ffffff;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      white-space: nowrap;
    }

    mrad-footer {
      display: block;
      width: 100%;
      background: #ffffff;
      margin-top: auto;
    }

    .mrad-global-footer {
      width: 100%;
      border-top: 1px solid #e2e8f0;
      background: #ffffff;
    }

    .mrad-local-slot-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 20px 32px;
    }

    .mrad-footer-bottom {
      border-top: 1px solid #f1f5f9;
      background: #ffffff;
      padding: 20px 0;
    }

    .mrad-footer-bottom-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .mrad-footer-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #64748b;
      font-size: 0.85rem;
    }

    .mrad-footer-legal {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .mrad-footer-legal a {
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .error-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px;
    }

    .error-card {
      max-width: 520px;
    }

    .error-code {
      font-size: 5.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #000000;
      margin-bottom: 16px;
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #000000;
      letter-spacing: -0.01em;
    }

    .error-desc {
      font-size: 1rem;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .error-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .btn-home {
      background: #000000;
      color: #ffffff;
      padding: 11px 22px;
      border-radius: 7px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
    }

    .btn-support {
      background: #ffffff;
      color: #000000;
      padding: 11px 22px;
      border-radius: 7px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      border: 1px solid #e2e8f0;
    }

    @media (max-width: 480px) {
      .error-code {
        font-size: 4rem;
      }
      .error-actions {
        flex-direction: column;
      }
      .mrad-support-link {
        display: none;
      }
    }
  </style>

  <script>
    class MradHeaderUniversal extends HTMLElement {
      connectedCallback() {
        const host = window.location.hostname.toLowerCase();
        
        let serviceName = "";
        if (host.startsWith("mrad.mrad.")) serviceName = "Mrad";
        else if (host.includes("account.")) serviceName = "Account";
        else if (host.includes("domains.")) serviceName = "Domains";
        else if (host.includes("email.")) serviceName = "Email";
        else if (host.includes("support.")) serviceName = "Support";

        const badgeHtml = serviceName 
          ? `<span class="mrad-service-badge">${serviceName}</span>` 
          : "";

        const isLoggedIn = document.cookie
          .split("; ")
          .some((item) => item.startsWith("mrad_session="));

        const authActions = isLoggedIn
          ? `<a href="https://account.mrad.co/id/home.html" class="mrad-btn-account">My Account</a>`
          : `
            <a href="https://account.mrad.co/id/sign-in.html" class="mrad-btn-auth">Sign In</a>
            <a href="https://account.mrad.co/id/sign-up.html" class="mrad-btn-auth">Sign Up</a>
          `;

        this.innerHTML = `
          <header class="mrad-global-bar">
            <div class="mrad-global-container">
              <a href="https://mrad.co" class="mrad-global-brand">
                <img src="https://mrad.co/image/logo.png" alt="Mrad" class="mrad-brand-logo" onerror="this.style.display='none'" />
                <span class="mrad-brand-title">Mrad ${badgeHtml}</span>
              </a>
              <div class="mrad-global-actions">
                <a href="https://support.mrad.co" class="mrad-support-link">Support</a>
                <div class="mrad-auth-group">
                  ${authActions}
                </div>
              </div>
            </div>
          </header>
        `;
      }
    }
    if (!customElements.get("mrad-header")) {
      customElements.define("mrad-header", MradHeaderUniversal);
    }

    class MradFooterUniversal extends HTMLElement {
      connectedCallback() {
        const currentYear = new Date().getFullYear();
        this.innerHTML = `
          <footer class="mrad-global-footer">
            <div class="mrad-local-slot-container" id="localSlot"></div>
            <div class="mrad-footer-bottom">
              <div class="mrad-footer-bottom-container">
                <div class="mrad-footer-brand">
                  <img src="https://mrad.co/image/logo.png" alt="Mrad" style="width:20px;height:20px;object-fit:contain;" onerror="this.style.display='none'" />
                  <span>&copy; ${currentYear} Mrad. All rights reserved.</span>
                </div>
                <div class="mrad-footer-legal">
                  <a href="https://mrad.co/privacy">Privacy</a>
                  <a href="https://mrad.co/terms">Terms</a>
                  <a href="https://status.mrad.co">System Status</a>
                </div>
              </div>
            </div>
          </footer>
        `;
      }
    }
    if (!customElements.get("mrad-footer")) {
      customElements.define("mrad-footer", MradFooterUniversal);
    }
  </script>
</head>
<body>

  <mrad-header></mrad-header>
  <mrad-header-nav></mrad-header-nav>

  <main class="error-wrapper">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Page not found</h1>
      <p class="error-desc">The link you followed may be broken, or the page may have been moved or removed from our infrastructure.</p>
      
      <div class="error-actions">
        <a href="/" id="returnHomeBtn" class="btn-home">Return Home</a>
        <a href="https://support.mrad.co" class="btn-support">Contact Support</a>
      </div>
    </div>
  </main>

  <mrad-footer></mrad-footer>

  <script>
    (function () {
      const host = window.location.hostname.toLowerCase();
      const returnBtn = document.getElementById("returnHomeBtn");
      const titleTag = document.getElementById("pageTitle");

      if (host.includes("account.")) {
        returnBtn.href = "/id/home.html";
        titleTag.textContent = "404 — Page Not Found | Mrad Account";
      } else {
        returnBtn.href = "/";
      }
    })();
  </script>

</body>
</html>
