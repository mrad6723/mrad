<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mrad</title>

  <link rel="icon" type="image/png" href="/image/favicon.png" />

  <!-- Global Shared Components -->
  <script src="/header.js?v=102" defer></script>
  <script src="/footer.js?v=102" defer></script>

  <!-- Local Subdomain Navigations -->
  <script src="/header-navigation.js?v=102" defer></script>
  <script src="/footer-navigation.js?v=102" defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 24px;
      text-align: center;
      flex: 1;
    }

    .hero-badge {
      display: inline-block;
      background: #f1f5f9;
      color: #000000;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid #e2e8f0;
      margin-bottom: 24px;
    }

    .hero-title {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 20px;
      color: #000000;
    }

    .hero-subtitle {
      font-size: 1.15rem;
      color: #475569;
      max-width: 620px;
      margin: 0 auto 36px;
      line-height: 1.6;
    }

    .cta-group {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .cta-primary {
      background: #000000;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    .cta-primary:hover {
      opacity: 0.8;
    }

    .cta-secondary {
      background: #ffffff;
      color: #000000;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid #e2e8f0;
      transition: background 0.15s ease;
    }

    .cta-secondary:hover {
      background: #f8fafc;
    }

    @media (max-width: 640px) {
      .hero-title {
        font-size: 2.2rem;
      }
      .cta-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <!-- Global Sticky Header (Auto detects domain) -->
  <mrad-header></mrad-header>

  <!-- Local Sticky Header Navigation -->
  <mrad-header-nav active="overview"></mrad-header-nav>

  <!-- Page Content -->
  <main class="hero-section">
    <div class="hero-badge">Welcome to Mrad</div>
    <h1 class="hero-title">Unified Business Infrastructure</h1>
    <p class="hero-subtitle">Access your domain management, enterprise email accounts, customer portal, and technical assistance from a single ecosystem.</p>
    
    <div class="cta-group">
      <a href="https://account.mrad.co/id/home" class="cta-primary">Access Mrad ID</a>
      <a href="https://support.mrad.co" class="cta-secondary">Contact Support</a>
    </div>
  </main>

  <!-- Global Footer -->
  <mrad-footer>
    <mrad-footer-nav></mrad-footer-nav>
  </mrad-footer>

</body>
</html>
