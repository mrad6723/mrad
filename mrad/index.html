<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mrad Mrad</title>

  <link rel="icon" type="image/png" href="https://mrad.co/image/favicon.png" />

  <!-- Global Shared Components -->
  <script src="https://mrad.co/header.js?v=300" defer></script>
  <script src="https://mrad.co/footer.js?v=105" defer></script>

  <!-- Local Subdomain Navigations -->
  <script src="/header-navigation.js?v=105" defer></script>
  <script src="/footer-navigation.js?v=300" defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 72px 24px;
      text-align: center;
      flex: 1;
      width: 100%;
    }

    .badge {
      display: inline-block;
      background: #f1f5f9;
      color: #000000;
      font-size: 0.84rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid #e2e8f0;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 18px;
    }

    .section-desc {
      font-size: 1.1rem;
      color: #475569;
      max-width: 600px;
      margin: 0 auto 36px;
      line-height: 1.6;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .btn-main {
      background: #000000;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    .btn-main:hover {
      opacity: 0.85;
    }

    .btn-alt {
      background: #ffffff;
      color: #000000;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid #e2e8f0;
      transition: background 0.15s ease;
    }

    .btn-alt:hover {
      background: #f8fafc;
    }

    @media (max-width: 640px) {
      .section-title {
        font-size: 2.1rem;
      }
      .btn-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <!-- Automatically identifies mrad.mrad.co and shows Mrad Mrad badge -->
  <mrad-header></mrad-header>
  <mrad-header-nav active="home"></mrad-header-nav>

  <main class="main-section">
    <div class="badge">Ecosystem Space</div>
    <h1 class="section-title">Mrad Mrad Subdomain</h1>
    <p class="section-desc">Dedicated environment configured under the mrad.mrad.co infrastructure zone.</p>

    <div class="btn-group">
      <a href="https://account.mrad.co/id/home" class="btn-main">My Account</a>
      <a href="https://mrad.co" class="btn-alt">Main Portal</a>
    </div>
  </main>

  <mrad-footer>
    <mrad-footer-nav></mrad-footer-nav>
  </mrad-footer>

</body>
</html>
