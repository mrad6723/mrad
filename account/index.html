<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRAD Identity — Account Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #38bdf8;
      --accent-indigo: #6366f1;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(11, 15, 25, 0.8);
      --input-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow-x: hidden;
      padding: 0 20px;
    }

    .glow-blob {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      top: -10%;
      left: 20%;
      background: radial-gradient(circle, var(--accent-cyan), transparent);
    }
    .blob-2 {
      bottom: -10%;
      right: 15%;
      background: radial-gradient(circle, var(--accent-indigo), transparent);
    }

    header {
      position: relative;
      z-index: 10;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: -0.5px;
      color: #fff;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .back-link {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--accent-cyan);
    }

    main {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      margin: 20px auto 40px;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 36px 32px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.7);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      background: linear-gradient(180deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .tab-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: rgba(11, 15, 25, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      letter-spacing: 0.02em;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .submit-btn {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.25);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .msg-banner {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      text-align: left;
    }

    .msg-banner.error {
      display: block;
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
    }

    .msg-banner.success {
      display: block;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    /* Dashboard state */
    .dashboard-view {
      display: none;
      text-align: center;
    }

    .user-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
      color: #fff;
      font-size: 1.5rem;
      font-weight: 700;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.3);
    }

    .user-meta {
      background: rgba(11, 15, 25, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin: 20px 0;
      text-align: left;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      overflow: hidden;
    }

    .meta-label {
      color: var(--text-muted);
    }

    .meta-val {
      color: #fff;
      font-weight: 600;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
      max-width: 200px;
    }

    .logout-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(244, 63, 94, 0.3);
      background: rgba(244, 63, 94, 0.1);
      color: #fda4af;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }

    .logout-btn:hover {
      background: rgba(244, 63, 94, 0.2);
    }

    footer {
      position: relative;
      z-index: 10;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="glow-blob blob-1"></div>
  <div class="glow-blob blob-2"></div>

  <header>
    <a href="https://mrad.co" class="brand">
      <div class="brand-mark">M</div>
      <div class="brand-title">MRAD ID</div>
    </a>
    <a href="https://mrad.co" class="back-link">&larr; Return to MRAD.co</a>
  </header>

  <main>
    <div class="auth-card">
      <div id="msg-box" class="msg-banner"></div>

      <!-- AUTH FORM VIEW -->
      <div id="auth-container">
        <div class="auth-header">
          <h1 id="portal-heading">Sign In</h1>
          <p id="portal-subheading">Enter your credentials to access your unified portal.</p>
        </div>

        <div class="tab-bar">
          <button class="tab-btn active" id="tab-login" type="button">Sign In</button>
          <button class="tab-btn" id="tab-register" type="button">Register</button>
        </div>

        <form id="auth-form">
          <div class="input-group hidden" id="group-name">
            <label for="user-name">Full Name</label>
            <input type="text" id="user-name" placeholder="John Doe" autocomplete="name" />
          </div>

          <div class="input-group">
            <label for="user-email">Email Address</label>
            <input type="email" id="user-email" placeholder="name@mrad.co" required autocomplete="email" />
          </div>

          <div class="input-group">
            <label for="user-password">Password</label>
            <input type="password" id="user-password" placeholder="••••••••••••" required autocomplete="current-password" />
          </div>

          <button type="submit" class="submit-btn" id="btn-submit">Continue with MRAD ID</button>
        </form>
      </div>

      <!-- DASHBOARD LOGGED IN VIEW -->
      <div id="dashboard-container" class="dashboard-view">
        <div class="user-avatar" id="dash-avatar">M</div>
        <h2 id="dash-name" style="font-size: 1.4rem; margin-bottom: 4px;">User</h2>
        <p id="dash-email" style="color: var(--accent-cyan); font-size: 0.9rem;"></p>

        <div class="user-meta">
          <div class="meta-row">
            <span class="meta-label">MRAD ID</span>
            <span class="meta-val" id="dash-uid">...</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">Status</span>
            <span class="meta-val" style="color: var(--accent-emerald);">Active Session</span>
          </div>
        </div>

        <button type="button" class="logout-btn" id="btn-logout">Sign Out</button>
      </div>
    </div>
  </main>

  <footer>
    <div>&copy; 2026 MRAD Organization</div>
    <a href="https://support.mrad.co" style="color: var(--text-muted); text-decoration: none;">Support Desk</a>
  </footer>

  <!-- Firebase Script Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      updateProfile, 
      onAuthStateChanged,
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD8-nfW9x9p4uLgitTyQ6Y64zLa9UzNDV8",
      authDomain: "mrad-6-7-2-3.firebaseapp.com",
      databaseURL: "https://mrad-6-7-2-3-default-rtdb.firebaseio.com",
      projectId: "mrad-6-7-2-3",
      storageBucket: "mrad-6-7-2-3.firebasestorage.app",
      messagingSenderId: "898456023777",
      appId: "1:898456023777:web:874f5511a9291e120bbda0",
      measurementId: "G-LF2M0T76FP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let mode = 'login';

    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const groupName = document.getElementById('group-name');
    const heading = document.getElementById('portal-heading');
    const subheading = document.getElementById('portal-subheading');
    const submitBtn = document.getElementById('btn-submit');
    const authForm = document.getElementById('auth-form');
    const msgBox = document.getElementById('msg-box');
    const authContainer = document.getElementById('auth-container');
    const dashboardContainer = document.getElementById('dashboard-container');
    const btnLogout = document.getElementById('btn-logout');

    function showMessage(text, isError = true) {
      msgBox.className = 'msg-banner ' + (isError ? 'error' : 'success');
      msgBox.innerText = text;
    }

    function clearMessage() {
      msgBox.className = 'msg-banner hidden';
      msgBox.innerText = '';
    }

    tabLogin.addEventListener('click', () => {
      mode = 'login';
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      groupName.classList.add('hidden');
      heading.innerText = 'Sign In';
      subheading.innerText = 'Enter your credentials to access your unified portal.';
      submitBtn.innerText = 'Continue with MRAD ID';
      clearMessage();
    });

    tabRegister.addEventListener('click', () => {
      mode = 'register';
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      groupName.classList.remove('hidden');
      heading.innerText = 'Create ID';
      subheading.innerText = 'Register for access across the MRAD ecosystem.';
      submitBtn.innerText = 'Create Account';
      clearMessage();
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage();
      
      const email = document.getElementById('user-email').value.trim();
      const password = document.getElementById('user-password').value;
      const name = document.getElementById('user-name').value.trim();

      submitBtn.disabled = true;
      submitBtn.innerText = 'Authenticating...';

      try {
        if (mode === 'register') {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          if (name) {
            await updateProfile(cred.user, { displayName: name });
          }
          showMessage('Account created successfully!', false);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        let msg = err.message;
        if (err.code === 'auth/invalid-credential') msg = 'Invalid email or password.';
        if (err.code === 'auth/email-already-in-use') msg = 'An account with this email already exists.';
        if (err.code === 'auth/weak-password') msg = 'Password should be at least 6 characters.';
        showMessage(msg, true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = mode === 'login' ? 'Continue with MRAD ID' : 'Create Account';
      }
    });

    btnLogout.addEventListener('click', async () => {
      await signOut(auth);
      clearMessage();
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        authContainer.classList.add('hidden');
        dashboardContainer.style.display = 'block';

        const displayName = user.displayName || 'Authorized User';
        document.getElementById('dash-name').innerText = displayName;
        document.getElementById('dash-email').innerText = user.email;
        document.getElementById('dash-uid').innerText = user.uid;
        document.getElementById('dash-avatar').innerText = displayName.charAt(0).toUpperCase();
      } else {
        dashboardContainer.style.display = 'none';
        authContainer.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
