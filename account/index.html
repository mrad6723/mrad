<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRAD Identity — Account Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(56, 189, 248, 0.35);
      --accent-cyan: #38bdf8;
      --accent-indigo: #6366f1;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(11, 15, 25, 0.8);
      --input-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow-x: hidden;
      padding: 0 20px;
    }

    /* Ambient background glows */
    .glow-blob {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.2;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      top: -10%;
      left: 20%;
      background: radial-gradient(circle, var(--accent-cyan), transparent);
    }
    .blob-2 {
      bottom: -10%;
      right: 15%;
      background: radial-gradient(circle, var(--accent-indigo), transparent);
    }

    /* Top navigation */
    header {
      position: relative;
      z-index: 10;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: -0.5px;
      color: #fff;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .back-link {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--accent-cyan);
    }

    /* Main Container */
    main {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      margin: 20px auto 40px;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 36px 32px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.7);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      background: linear-gradient(180deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Auth Mode Switcher */
    .tab-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: rgba(11, 15, 25, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    /* Form Styles */
    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      letter-spacing: 0.02em;
    }

    .forgot-link {
      font-size: 0.75rem;
      color: var(--accent-cyan);
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .submit-btn {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.25);
    }

    .submit-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    /* SSO Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    /* SSO Buttons */
    .sso-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .sso-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .sso-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .sso-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Footer badge */
    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 24px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .security-note svg {
      color: var(--accent-emerald);
    }

    footer {
      position: relative;
      z-index: 10;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .footer-links {
      display: flex;
      gap: 18px;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
    }

    .footer-links a:hover {
      color: var(--text-main);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="glow-blob blob-1"></div>
  <div class="glow-blob blob-2"></div>

  <!-- Header -->
  <header>
    <a href="https://mrad.co" class="brand">
      <div class="brand-mark">M</div>
      <div class="brand-title">MRAD ID</div>
    </a>
    <a href="https://mrad.co" class="back-link">&larr; Return to MRAD.co</a>
  </header>

  <!-- Auth Card -->
  <main>
    <div class="auth-card">
      <div class="auth-header">
        <h1 id="portal-heading">Sign In</h1>
        <p id="portal-subheading">Enter your credentials to access your unified portal.</p>
      </div>

      <div class="tab-bar">
        <button class="tab-btn active" id="tab-login" onclick="setMode('login')">Sign In</button>
        <button class="tab-btn" id="tab-register" onclick="setMode('register')">Register</button>
      </div>

      <form id="auth-form" onsubmit="handleAuth(event)">
        <div class="input-group hidden" id="group-name">
          <label for="user-name">Full Name</label>
          <input type="text" id="user-name" placeholder="John Doe" autocomplete="name" />
        </div>

        <div class="input-group">
          <label for="user-email">Email Address</label>
          <input type="email" id="user-email" placeholder="name@mrad.co" required autocomplete="email" />
        </div>

        <div class="input-group">
          <div class="input-header">
            <label for="user-password">Password</label>
            <a href="https://support.mrad.co" class="forgot-link" id="link-forgot">Forgot?</a>
          </div>
          <input type="password" id="user-password" placeholder="••••••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" class="submit-btn" id="btn-submit">Continue with MRAD ID</button>
      </form>

      <div class="divider">or authenticate with</div>

      <div class="sso-grid">
        <button type="button" class="sso-btn" onclick="alert('Google Auth hook ready for Firebase SDK')">
          <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.3l3.7 2.9C6.2 7.3 8.8 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/><path fill="#FBBC05" d="M5.3 14.8c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3L1.6 7.3C.6 9.3 0 11.6 0 14s.6 4.7 1.6 6.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.2 0-5.8-2.3-6.7-5.2L1.6 16c1.9 3.7 5.8 7 10.4 7z"/></svg>
          Google
        </button>

        <button type="button" class="sso-btn" onclick="alert('GitHub Auth hook ready for Firebase SDK')">
          <svg fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
          GitHub
        </button>
      </div>

      <div class="security-note">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        <span>End-to-End Encrypted Authentication</span>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div>&copy; 2026 MRAD Organization</div>
    <div class="footer-links">
      <a href="https://support.mrad.co">Privacy Policy</a>
      <a href="https://support.mrad.co">Terms of Service</a>
      <a href="https://support.mrad.co">Help Desk</a>
    </div>
  </footer>

  <script>
    let mode = 'login';

    function setMode(newMode) {
      mode = newMode;
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const groupName = document.getElementById('group-name');
      const heading = document.getElementById('portal-heading');
      const subheading = document.getElementById('portal-subheading');
      const submitBtn = document.getElementById('btn-submit');
      const forgotLink = document.getElementById('link-forgot');

      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        groupName.classList.add('hidden');
        heading.innerText = 'Sign In';
        subheading.innerText = 'Enter your credentials to access your unified portal.';
        submitBtn.innerText = 'Continue with MRAD ID';
        forgotLink.style.display = 'inline';
      } else {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        groupName.classList.remove('hidden');
        heading.innerText = 'Create ID';
        subheading.innerText = 'Register for access across the MRAD ecosystem.';
        submitBtn.innerText = 'Create Account';
        forgotLink.style.display = 'none';
      }
    }

    function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('user-email').value;
      alert((mode === 'login' ? 'Signing in ' : 'Creating account for ') + email + '\n\n(Ready to link with Firebase Authentication SDK)');
    }
  </script>
</body>
</html>
