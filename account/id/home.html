<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home — MRAD ID</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b0f17;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #161e2e;
      border: 1px solid #283548;
      padding: 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .logo-mark {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p.sub {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .info-box {
      background: #0b0f17;
      border: 1px solid #283548;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
      font-size: 0.9rem;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #1e293b;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .label {
      color: #94a3b8;
    }
    .val {
      color: #f1f5f9;
      font-weight: 500;
    }
    .status-badge {
      color: #4ade80;
      font-weight: 600;
    }
    .services-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .service-btn {
      display: block;
      padding: 12px;
      background: #0b0f17;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s;
    }
    .service-btn:hover {
      background: #1e293b;
      border-color: #64748b;
    }
    .btn-signout {
      width: 100%;
      background: transparent;
      border: 1px solid #334155;
      color: #ffffff;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-signout:hover {
      background: #1e293b;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-mark">🌐</div>
    <h1>Customer Home</h1>
    <p class="sub">Welcome to your MRAD control panel</p>

    <div class="info-box">
      <div class="info-row">
        <span class="label">Email:</span>
        <span class="val" id="user-email">Loading...</span>
      </div>
      <div class="info-row">
        <span class="label">Status:</span>
        <span class="status-badge">Active</span>
      </div>
    </div>

    <div class="services-grid">
      <a href="https://email.mrad.co" class="service-btn">Open Webmail</a>
      <a href="https://domains.mrad.co" class="service-btn">Manage Domains</a>
    </div>

    <button id="signout-btn" class="btn-signout">Sign Out</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD8-nfW9x9p4uLgitTyQ6Y64zLa9UzNDV8",
      authDomain: "mrad-6-7-2-3.firebaseapp.com",
      databaseURL: "https://mrad-6-7-2-3-default-rtdb.firebaseio.com",
      projectId: "mrad-6-7-2-3",
      storageBucket: "mrad-6-7-2-3.firebasestorage.app",
      messagingSenderId: "898456023777",
      appId: "1:898456023777:web:874f5511a9291e120bbda0",
      measurementId: "G-LF2M0T76FP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "/sign-in";
      } else {
        document.getElementById("user-email").innerText = user.email;
      }
    });

    document.getElementById("signout-btn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "/sign-in";
    });
  </script>
</body>
</html>
