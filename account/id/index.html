<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mrad ID</title>

  <link rel="icon" type="image/png" href="https://mrad.co/image/favicon.png" />

  <!-- Global Shared Components -->
  <script src="https://mrad.co/header.js?v=106" defer></script>
  <script src="https://mrad.co/footer.js?v=106" defer></script>

  <script>
    // If the user already has a session, redirect to /id/home
    const hasSession = document.cookie.split("; ").some(c => c.startsWith("mrad_session="));
    if (hasSession) {
      window.location.replace("/id/home");
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .gateway-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .gateway-content {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .gateway-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      display: block;
      margin-bottom: 28px;
    }

    .action-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .action-label {
      font-size: 0.92rem;
      font-weight: 500;
      color: #64748b;
      margin-bottom: 10px;
    }

    .btn-action-primary {
      display: block;
      width: 100%;
      background: #000000;
      color: #ffffff;
      padding: 12px 0;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s ease;
      margin-bottom: 24px;
    }

    .btn-action-primary:hover {
      opacity: 0.85;
    }

    .btn-action-secondary {
      display: block;
      width: 100%;
      background: #ffffff;
      color: #000000;
      padding: 12px 0;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid #e2e8f0;
      transition: background-color 0.15s ease;
    }

    .btn-action-secondary:hover {
      background-color: #f8fafc;
    }
  </style>
</head>
<body>

  <mrad-header></mrad-header>

  <main class="gateway-container">
    <div class="gateway-content">
      <img src="https://mrad.co/image/logo.png" alt="Mrad" class="gateway-logo" />

      <div class="action-group">
        <p class="action-label">Already have an account?</p>
        <a href="https://account.mrad.co/id/sign-in" class="btn-action-primary">Sign In</a>

        <p class="action-label">New to Mrad?</p>
        <a href="https://account.mrad.co/id/sign-up" class="btn-action-secondary">Sign Up</a>
      </div>
    </div>
  </main>

  <mrad-footer></mrad-footer>

</body>
</html>
