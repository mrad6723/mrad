<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mrad ID Gateway</title>

  <link rel="icon" type="image/png" href="https://mrad.co/image/favicon.png" />

  <!-- Global Shared Components -->
  <script src="https://mrad.co/header.js?v=102" defer></script>
  <script src="https://mrad.co/footer.js?v=102" defer></script>

  <script>
    // If the user already has a session, automatically send them to /id/home.html
    const hasSession = document.cookie.split("; ").some(c => c.startsWith("mrad_session="));
    if (hasSession) {
      window.location.replace("/id/home.html");
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .gateway-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
    }

    .gateway-card {
      width: 100%;
      max-width: 460px;
      text-align: center;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 44px 32px;
      background: #ffffff;
    }

    .gateway-logo {
      width: 44px;
      height: 44px;
      margin-bottom: 16px;
    }

    .gateway-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .gateway-desc {
      font-size: 0.95rem;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-action-primary {
      display: block;
      background: #000000;
      color: #ffffff;
      padding: 13px;
      border-radius: 8px;
      font-size: 0.94rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    .btn-action-primary:hover {
      opacity: 0.85;
    }

    .btn-action-secondary {
      display: block;
      background: #ffffff;
      color: #000000;
      padding: 13px;
      border-radius: 8px;
      font-size: 0.94rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid #e2e8f0;
      transition: background-color 0.15s ease;
    }

    .btn-action-secondary:hover {
      background-color: #f8fafc;
    }
  </style>
</head>
<body>

  <mrad-header></mrad-header>

  <main class="gateway-container">
    <div class="gateway-card">
      <img src="https://mrad.co/image/logo.png" alt="Mrad" class="gateway-logo" />
      <h1 class="gateway-title">Mrad ID</h1>
      <p class="gateway-desc">One single account to sign in and securely manage all your services across the Mrad network.</p>

      <div class="action-stack">
        <a href="/id/sign-in.html" class="btn-action-primary">Sign In with Mrad ID</a>
        <a href="/id/sign-up.html" class="btn-action-secondary">Create a Mrad ID</a>
      </div>
    </div>
  </main>

  <mrad-footer></mrad-footer>

</body>
</html>
