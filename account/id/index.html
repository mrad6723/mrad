<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRAD ID</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b0f17;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #161e2e;
      border: 1px solid #283548;
      padding: 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .logo-mark {
      font-size: 1.8rem;
      margin-bottom: 12px;
      display: inline-block;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      text-align: center;
      transition: background 0.2s, color 0.2s;
    }
    .btn-primary {
      background: #ffffff;
      color: #0b0f17;
    }
    .btn-primary:hover {
      background: #e2e8f0;
    }
    .btn-outline {
      background: transparent;
      color: #ffffff;
      border: 1px solid #334155;
    }
    .btn-outline:hover {
      background: #1e293b;
    }
    #loading-state {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .footer-link {
      margin-top: 28px;
      font-size: 0.85rem;
    }
    .footer-link a {
      color: #64748b;
      text-decoration: none;
    }
    .footer-link a:hover {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="loading-state">
      Verifying session...
    </div>

    <div id="landing-ui" style="display: none;">
      <div class="logo-mark">🌐</div>
      <h1>MRAD ID</h1>
      <p>Sign in to manage your account and services</p>

      <div class="btn-group">
        <a href="/sign-in" class="btn btn-primary">Sign In</a>
        <a href="/sign-up" class="btn btn-outline">Sign Up</a>
      </div>

      <div class="footer-link">
        <a href="https://www.mrad.co">← Back to mrad.co</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // REPLACE WITH YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "id.account.mrad.co",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Redirect to dashboard if logged in
        window.location.href = "/dashboard";
      } else {
        // Show choice UI if not logged in
        document.getElementById("loading-state").style.display = "none";
        document.getElementById("landing-ui").style.display = "block";
      }
    });
  </script>
</body>
</html>
