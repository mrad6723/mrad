<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Mrad Account</title>

  <link rel="icon" type="image/png" href="https://mrad.co/image/favicon.png" />

  <script>
    // Immediate session check: if already signed in, redirect straight to dashboard
    const hasSession = document.cookie.split("; ").some(c => c.startsWith("mrad_session="));
    if (hasSession) {
      window.location.replace("/id/home");
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Global Header */
    .mrad-top-header {
      width: 100%;
      height: 56px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      background: #ffffff;
    }

    .mrad-top-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mrad-top-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #000000;
    }

    .mrad-top-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
      display: block;
    }

    .mrad-top-name {
      font-size: 1.18rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mrad-badge {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 5px;
      text-transform: uppercase;
    }

    .mrad-top-links {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .mrad-top-links a {
      color: #000000;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .mrad-top-btn {
      padding: 6px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 600;
    }

    /* Main Container */
    .main-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .center-logo {
      width: 52px;
      height: 52px;
      object-fit: contain;
      display: block;
      margin-bottom: 12px;
    }

    .center-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      text-align: center;
    }

    .left-subtext {
      width: 100%;
      text-align: left;
      font-size: 0.95rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 20px;
    }

    .auth-form {
      width: 100%;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .field-input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      font-size: 0.92rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #000000;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field-input:focus {
      border-color: #000000;
      box-shadow: 0 0 0 1px #000000;
    }

    .btn-submit {
      width: 100%;
      height: 46px;
      background: #000000;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.94rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.15s ease;
    }

    .btn-submit:hover {
      opacity: 0.85;
    }

    /* Bottom Footer */
    .mrad-bottom-footer {
      width: 100%;
      border-top: 1px solid #f1f5f9;
      padding: 20px 0;
      margin-top: auto;
    }

    .mrad-bottom-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.85rem;
      color: #64748b;
    }

    .mrad-bottom-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mrad-bottom-legal {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .mrad-bottom-legal a {
      color: #64748b;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .mrad-support-hide {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="mrad-top-header">
    <div class="mrad-top-inner">
      <a href="https://mrad.co" class="mrad-top-brand">
        <img src="https://mrad.co/image/logo.png" alt="Mrad" class="mrad-top-logo" onerror="this.style.display='none'" />
        <span class="mrad-top-name">Mrad <span class="mrad-badge">Account</span></span>
      </a>
      <div class="mrad-top-links">
        <a href="https://support.mrad.co" class="mrad-support-hide">Support</a>
        <a href="https://account.mrad.co/id/sign-in" class="mrad-top-btn">Sign In</a>
      </div>
    </div>
  </header>

  <!-- Center Content -->
  <main class="main-wrap">
    <div class="auth-card">
      <img src="https://mrad.co/image/logo.png" alt="Mrad" class="center-logo" onerror="this.style.display='none'" />
      <h1 class="center-title">Mrad Account</h1>

      <p class="left-subtext">Create a Mrad Account</p>

      <form id="signUpForm" class="auth-form" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label class="field-label" for="email">EMail</label>
          <input 
            class="field-input" 
            type="email" 
            id="email" 
            name="email" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="field-label" for="password">Password</label>
          <input 
            class="field-input" 
            type="password" 
            id="password" 
            name="password" 
            required 
            autocomplete="new-password"
          />
        </div>

        <div class="form-group">
          <label class="field-label" for="phone">Phone</label>
          <input 
            class="field-input" 
            type="tel" 
            id="phone" 
            name="phone" 
            required 
            autocomplete="tel"
          />
        </div>

        <div class="form-group">
          <label class="field-label" for="firstName">First Name</label>
          <input 
            class="field-input" 
            type="text" 
            id="firstName" 
            name="firstName" 
            required 
            autocomplete="given-name"
          />
        </div>

        <div class="form-group">
          <label class="field-label" for="lastName">Last Name</label>
          <input 
            class="field-input" 
            type="text" 
            id="lastName" 
            name="lastName" 
            required 
            autocomplete="family-name"
          />
        </div>

        <button type="submit" class="btn-submit">Sign Up</button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mrad-bottom-footer">
    <div class="mrad-bottom-inner">
      <div class="mrad-bottom-brand">
        <img src="https://mrad.co/image/logo.png" alt="Mrad" style="width:20px;height:20px;object-fit:contain;" onerror="this.style.display='none'" />
        <span>&copy; 2026 Mrad. All rights reserved.</span>[span_0](start_span)[span_0](end_span)
      </div>
      <div class="mrad-bottom-legal">
        <a href="https://mrad.co/privacy">Privacy</a>
        <a href="https://mrad.co/terms">Terms</a>
        <a href="https://status.mrad.co">System Status</a>
      </div>
    </div>
  </footer>

</body>
</html>
