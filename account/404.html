<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">404 — Page Not Found | Mrad</title>

  <script>
    (function() {
      var p = window.location.pathname.replace(/\.html$/, "");
      if (p.startsWith("/uid/") || p === "/uid") {
        var hasSession = document.cookie.split("; ").some(function(c) { return c.startsWith("mrad_session="); });
        if (!hasSession && p !== "/uid") {
          window.location.replace("https://account.mrad.co/uid");
        }
      }
    })();
  </script>
  <link rel="icon" type="image/png" href="https://mrad.co/image/favicon.png" />

  <!-- Shared Global Components -->
  <script src="https://mrad.co/header.js?v=302" defer></script>
  <script src="https://mrad.co/footer.js?v=102" defer></script>

  <!-- Local Subdomain Navigations -->
  <script src="/header-navigation.js" defer></script>
  <script src="/footer-navigation.js?v=300" defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .error-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .error-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    .error-code {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      color: #0f172a;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }

    .error-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .error-desc {
      font-size: 0.95rem;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn-home {
      display: inline-block;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }

    .btn-home:hover {
      background: #1e293b;
    }

    .btn-support {
      display: inline-block;
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }

    .btn-support:hover {
      background: #f1f5f9;
    }

    @media (max-width: 480px) {
      .error-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <mrad-header></mrad-header>
  <mrad-header-nav></mrad-header-nav>

  <main class="error-wrapper">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Page not found</h1>
      <p class="error-desc">The link you followed may be broken, or the page may have been moved or removed from our infrastructure.</p>
      <div class="error-actions">
        <a href="/" id="returnHomeBtn" class="btn-home">Return Home</a>
        <a href="https://support.mrad.co" class="btn-support">Contact Support</a>
      </div>
    </div>
  </main>

  <mrad-footer></mrad-footer>

  <script>
    (function () {
      const host = window.location.hostname.toLowerCase();
      const returnBtn = document.getElementById("returnHomeBtn");
      const titleTag = document.getElementById("pageTitle");

      if (host.includes("account.")) {
        returnBtn.href = "/uid/home";
        titleTag.textContent = "404 — Page Not Found | Mrad Account";
      } else {
        returnBtn.href = "/";
      }
    })();
  </script>
</body>
</html>
