name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Automatically distributes www/404.html to all other sites
      - name: Sync Universal 404 to all targets
        run: |
          for dir in account domains email mrad support; do
            if [ -d "$dir" ]; then
              cp www/404.html "$dir/404.html"
            fi
          done

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: mrad-6-7-2-3
